name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Lấy source code
        uses: actions/checkout@v7
      - name: Cài Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài dependencies đúng lockfile
        run: npm ci
      - name: Kiểm tra lint
        run: npm run lint
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Lấy source code
        uses: actions/checkout@v7
      - name: Cài Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cho phép chạy Maven Wrapper
        run: chmod +x mvnw
      - name: Chạy backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test
