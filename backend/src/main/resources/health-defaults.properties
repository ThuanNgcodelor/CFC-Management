# Local opt-in only. Internal health and personal self-service are independently disabled by default.
cfc.health.enabled=${HEALTH_ENABLED:false}
# Public lookup has an independent gate; neither flag is enabled on production by this change.
cfc.health.self-service.enabled=${HEALTH_SELF_SERVICE_ENABLED:false}
cfc.health.self-service.grant-days=${HEALTH_SELF_GRANT_DAYS:90}
cfc.health.self-service.session-minutes=${HEALTH_SELF_SESSION_MINUTES:15}
